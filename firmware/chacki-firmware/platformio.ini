; Chacki - cyberpunk AI desktop pet
; Target: M5Stack CoreS3-SE (ESP32-S3, 16MB flash, 8MB PSRAM)
;
; Build:   pio run
; Flash:   pio run -t upload          (direct USB flash, replaces M5 Launcher!)
; Launcher: copy dist/Chacki-CoreS3SE-launcher.bin to the SD card and install it from M5 Launcher.

[platformio]
default_envs = cores3se

[env:cores3se]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCHACKI_VERSION=\"0.2.0\"

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0

extra_scripts = post:scripts/make_bins.py

; Wireless upload from VS Code / CLI (only when Chacki runs in "direct" OTA mode,
; i.e. flashed with the full image, not under M5 Launcher):
;   set CHACKI_PASS=<web password shown on the info card>
;   pio run -e cores3se-ota -t upload
[env:cores3se-ota]
extends = env:cores3se
upload_protocol = espota
upload_port = chacki.local
upload_flags =
    --auth=${sysenv.CHACKI_PASS}
